 if(navigator.share){navigator.share({text:t}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert('Result copied. Paste it anywhere to share!')})}else alert(t)}
function tile(ic,bg,v,l){return '<div class="tile"><i style="background:'+bg+'">'+ic+'</i><div><b>'+v+'</b><span>'+l+'</span></div></div>'}
function result(){
 var n=sess.its.length,sk=n-sess.c-sess.w,T=tier(sess.pct),C=2*Math.PI*52,att=sess.c+sess.w;
 var h='<div class="rhero" style="background:linear-gradient(135deg,'+T.a+','+T.b+')"><div style="font-size:2rem">'+T.e+'</div><h2>'+T.t+'</h2><p>'+T.m+'</p><div class="ring" style="margin-top:12px"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="10"/><circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1.2s ease-out"/></svg><div class="mid"><b>'+sess.pct+'%</b><small>'+num(sess.marks)+' / '+num(sess.max)+' marks</small></div></div><p style="margin-top:8px;font-weight:700">'+esc(sess.title)+'</p></div>';
 var cm=[];
 if(sess.prev){if(sess.pct>sess.prev.best)cm.push('<span class="up">🎉 New personal best!</span>');else cm.push('<span>Best: '+sess.prev.best+'%</span>');
  if(sess.prev.last!=null){var d=sess.pct-sess.prev.last;cm.push('<span class="'+(d>=0?'up':'dn')+'">'+(d>=0?'▲ +':'▼ ')+d+'% vs last attempt</span>')}}
 else if(sess.rec)cm.push('<span>🌟 First attempt – nice start!</span>');
 if(cm.length)h+='<div class="cmp">'+cm.join('')+'</div>';
 h+='<div class="tiles">'+tile('✔','#dcfce7',sess.c,'Correct')+tile('✘','#fee2e2',sess.w,'Wrong'+(sess.neg>0&&sess.w?' (−'+num(sess.w*sess.neg)+')':''))+tile('➖','#e5e7eb',sk,'Skipped')+tile('🎯','#dbeafe',(att?Math.round(sess.c*100/att):0)+'%','Accuracy')+tile('⏱','#fef3c7',dur(sess.el),'Time taken')+tile('⚡','#ede9fe',att?dur(sess.el/n):'–','Avg per question')+'</div>';
 var pc=sess.c*100/n,pw=sess.w*100/n;
 h+='<div class="card"><b>Answer breakdown</b><div class="stack" style="margin-top:8px"><i style="width:'+pc+'%;background:var(--ok)"></i><i style="width:'+pw+'%;background:var(--bad)"></i></div><div class="legend"><span><i style="background:var(--ok)"></i>Correct '+sess.c+'</span><span><i style="background:var(--bad)"></i>Wrong '+sess.w+'</span><span><i style="background:#cbd0dc"></i>Skipped '+sk+'</span></div></div>';
 var mx=1,slow=0;sess.its.forEach(function(_,i){var t=sess.qt[i]||0;if(t>mx){mx=t;slow=i}});
 h+='<div class="card"><b>Time per question</b> <span class="note">· slowest: Q'+(slow+1)+' ('+dur(mx/1000)+')</span><div class="tbars">'+sess.its.map(function(it,i){var a=sess.ans[i],col=a===undefined?'#cbd0dc':a===it.q.a?'var(--ok)':'var(--bad)';return'<div style="height:'+Math.max(4,(sess.qt[i]||0)*100/mx)+'%;background:'+col+'" title="Q'+(i+1)+': '+dur((sess.qt[i]||0)/1000)+'"></div>'}).join('')+'</div></div>';
 h+='<div class="card"><b>Question map</b> <span class="note">· tap to jump to review</span><div class="qmap" style="margin-top:8px">'+sess.its.map(function(it,i){var a=sess.ans[i];return'<a href="#" data-a="jump" data-v="'+i+'" style="background:'+(a===undefined?'#cbd0dc':a===it.q.a?'var(--ok)':'var(--bad)')+'">'+(i+1)+'</a>'}).join('')+'</div></div>';
 h+='<div class="row" style="justify-content:center;margin:14px 0"><button class="btn" data-a="home">Back to tests</button>'+(sess.rec?'<button class="btn sec" data-a="begin" data-v="'+sess.mode+'|'+esc(sess.id)+'">🔁 Retry</button>':'')+'<button class="btn sec" data-a="share">📤 Share score</button></div>';
 h+='<h2 id="rvh">Review</h2><div class="cats">'+[['all','All'],['wrong','Wrong ('+sess.w+')'],['skip','Skipped ('+sk+')'],['ok','Correct ('+sess.c+')']].map(function(x){return'<button class="'+(sess.rf===x[0]?'on':'')+'" data-a="rf" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
 sess.its.forEach(function(it,i){var q=it.q,a=sess.ans[i],ok=a===q.a,f=sess.rf;
  if(f==='wrong'&&(a===undefined||ok))return;if(f==='skip'&&a!==undefined)return;if(f==='ok'&&!ok)return;
  h+='<div class="rv '+(ok?'ok':'bad')+'" id="rv-'+i+'"><div class="row"><b class="grow">'+(i+1)+'. <span class="note">⏱ '+dur((sess.qt[i]||0)/1000)+'</span></b>'+starBtn(it.key)+'</div><p style="margin:0;white-space:pre-wrap"><b>'+esc(q.q)+'</b></p>'+img(q.qi);
  h+='<p style="margin:4px 0">Your answer: '+(a===undefined?'<i>skipped</i>':'<b style="color:var(--'+(ok?'ok':'bad')+')">'+LET[a]+'. '+esc(q.o[a])+'</b>')+'</p>';
  if(!ok)h+='<p style="margin:4px 0">Correct: <b style="color:var(--ok)">'+LET[q.a]+'. '+esc(q.o[q.a])+'</b></p>';
  if(q.e||q.ai)h+='<div class="exp">'+esc(q.e||'')+img(q.ai)+'</div>';
  h+='<textarea class="nt" data-nk="'+esc(it.key)+'" placeholder="📝 Your note…">'+esc(S.notes[it.key]||'')+'</textarea></div>'});
 return h}
function modal(h){closeM();var m=document.createElement('div');m.className='modal';m.id='mod';m.innerHTML='<div>'+h+'</div>';document.body.appendChild(m)}
function closeM(){var m=$('#mod');if(m)m.remove()}
function restoreMsg(){var r=window.__restore,h='';
 if(r==='ok')h+='<div class="card" style="border:2px solid var(--ok);margin-bottom:10px"><b style="color:var(--ok)">✓ Unlocked on this browser</b><p class="note" style="margin:4px 0 0">Your purchase has been restored here.</p></div>';
 else if(r)h+='<div class="card" style="border:2px solid #ef4444;margin-bottom:10px"><b>Could not restore</b><p class="note" style="margin:4px 0 0">'+esc(r==='bad'?'The code did not match. Please contact support.':r)+'</p></div>';
 if(CFG.api&&CFG.ct&&inApp()&&!allOpen())h+='<div style="background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:10px;margin-bottom:10px;font-size:.88rem">📱 You are viewing this inside the Facebook/Instagram app. For the best experience tap <b>⋮ / •••</b> → <b>Open in Chrome / Safari</b>.</div>';
 return h}
function inApp(){return /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Snapchat|LinkedInApp|MicroMessenger|Twitter|Line\//i.test(navigator.userAgent||'')}
function rzpLoad(){return new Promise(function(res,rej){if(window.Razorpay)return res();var s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=res;s.onerror=function(){rej(new Error('Could not load the payment window. Check your internet connection.'))};document.head.appendChild(s)})}
async function api(path,body){var r=await fetch(CFG.api+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});var j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Server error ('+r.status+')');return j}
async function claim(o,p,mail){S.pend={o:o,p:p};save();var j=await api('/claim',{order_id:o,payment_id:p,mail:!!mail,page:location.pathname}),ok=0;for(var i=0;i<j.codes.length;i++){if(await tryCode(j.codes[i]))ok++}if(ok){S.pend=null;save()}return ok}
function isCls(p){return p.kind==='pack'&&p.fl&&p.fl.length>0}
function unlockModal(ctx,pre){
 var rank={single:0,pack:1,full:2},base=CFG.prods.filter(function(p){if(owned(p))return false;if(ctx)return p.tests.indexOf(ctx)>=0;return p.kind!=='single'||p.ix===pre}),
  opts=base.filter(function(p){return!isCls(p)}).sort(function(a,b){return ctx?rank[a.kind]-rank[b.kind]:(a.kind==='full'?-1:b.kind==='full'?1:0)}),cl=base.filter(isCls);
 if(!opts.length&&!cl.length){modal('<p>You already own everything here. 🎉</p><button class="btn sec" data-a="close">Close</button>');return}
 var preCls=pre!=null&&cl.filter(function(p){return p.ix===pre})[0]?pre:null,sel=preCls!=null?null:(pre!=null&&opts.filter(function(p){return p.ix===pre})[0]?pre:(opts[0]?opts[0].ix:null));
 function pr(p){var o=p.mrp&&+p.mrp>+p.price?'<s>₹'+esc(p.mrp)+'</s> ':'';return esc(p.kind==='full'?'Complete book':p.name)+' – '+o+'₹'+esc(p.price)}
 var h='<h2 style="margin-top:0">Unlock</h2>'+(opts.length+cl.length>1?'<p style="margin:0 0 6px"><b>1.</b> Choose what to unlock</p>':'')+opts.map(function(p){return'<label class="rad'+(p.ix===sel?' on':'')+'"><input type="radio" name="pp" value="'+p.ix+'"'+(p.ix===sel?' checked':'')+'><div><b>'+pr(p)+'</b><span>'+(p.kind==='single'?'Single test':p.tests.length+' tests')+'</span></div></label>'}).join('');
 if(cl.length)h+='<p class="note" style="margin:10px 0 4px"><b>Classes</b> – tick one, two or more:</p>'+cl.map(function(p){var on=p.ix===preCls;return'<label class="rad'+(on?' on':'')+'"><input type="checkbox" name="cc" value="'+p.ix+'"'+(on?' checked':'')+'><div><b>📁 '+pr(p)+'</b><span>All subjects &amp; chapters · '+p.tests.length+' tests</span></div></label>'}).join('');
 h+='<div id="paybox"></div><p><b>'+(opts.length+cl.length>1?'3':'2')+'.</b> Enter the unlock code we send you (paste several codes together if you bought more than one):</p><textarea id="code" rows="2" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" style="font-family:monospace;text-transform:uppercase"></textarea><div id="cm" class="msg"></div><div class="row" style="margin-top:12px"><button class="btn ok grow" data-a="doUnlock">Unlock now</button><button class="btn sec" data-a="close">Close</button></div><p class="note">The code works only on this device &amp; browser. Please keep using the same browser.</p>';
 modal(h);payBox(selIx())}
function selIx(){var r=document.querySelector('input[name=pp]:checked');if(r)return[+r.value];return[].map.call(document.querySelectorAll('input[name=cc]:checked'),function(x){return+x.value})}
function payBox(list){
 var ps=[].concat(list).map(function(i){return prodByIx(+i)}).filter(Boolean);if(!ps.length){$('#paybox').innerHTML='<p class="note">Choose what you want to unlock above.</p>';return}
 var tot=ps.reduce(function(a,p){return a+(+p.price||0)},0),nm=ps.map(function(p){return p.kind==='full'?'Complete book':p.name}).join(' + '),n=CFG.prods.length>1?'2':'1',one=ps.length===1?ps[0]:null;
 var pay=CFG.upi?'<p>Pay <b>₹'+tot+'</b> to UPI ID: <span class="mono">'+esc(CFG.upi)+'</span></p>':'<p>Amount: <b>₹'+tot+'</b></p>';
 var msg=encodeURIComponent(CFG.title+' - unlock request\nItem: '+nm+'\nUTR/Txn ID: \nDevice ID: '+fmt(S.dev)+'\nPaid: Rs '+tot);
 var wa=CFG.contact?'<p><a class="btn sec sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(String(CFG.contact).replace(/\D/g,''))+'?text='+msg+'">Send request on WhatsApp</a></p>':'';
 var pl=one&&one.payLink?'<p><a class="btn ok" target="_blank" rel="noopener" href="'+esc(one.payLink)+'">💳 Pay ₹'+esc(one.price)+' online</a></p><p class="note" style="margin-top:-6px">After paying, send the receipt/UTR with your Device ID below.</p>':'';
 var auto=CFG.api?(inApp()?'<div class="warn" style="background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:10px;margin:0 0 10px;font-size:.88rem">📱 <b>You are inside the Facebook/Instagram app.</b> For best results tap <b>⋮ / •••</b> → <b>Open in Chrome / Safari</b> before paying. If you pay here, we email you a link to unlock in your normal browser too.</div>':'')+'<label style="margin:0 0 4px">Your email (we send your code &amp; restore link)</label><input id="em" type="email" placeholder="you@example.com" autocomplete="email" value="'+esc(S.email||'')+'" style="margin-bottom:10px"><button class="btn ok" style="width:100%;font-size:1.05rem;padding:13px" data-a="rzp">⚡ Pay ₹'+tot+' &amp; unlock instantly</button><p class="note" style="margin:6px 0 2px">Secure payment by Razorpay (UPI, cards, netbanking). Unlocks automatically.</p><p class="note" style="margin:0 0 6px"><a href="#" data-a="rzpid">Already paid but not unlocked?</a></p><details style="margin:8px 0"><summary class="note" style="cursor:pointer">Prefer paying manually by UPI?</summary>':'';
 $('#paybox').innerHTML=auto+pl+'<p><b>'+n+'.</b> Pay and send us your payment reference (UTR), the item'+(ps.length>1?'s':'')+' (<b>'+esc(nm)+'</b>) and this Device ID:</p>'+pay+'<p><span class="mono">'+fmt(S.dev)+'</span></p>'+wa+(CFG.api?'</details>':'')}
document.addEventListener('click',async function(e){
 var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,v=t.dataset.v;
 if(a==='unlock')unlockModal(v||null);else if(a==='buy')unlockModal(null,+v);else if(a==='close')closeM();
 else if(a==='doUnlock'){var b=t;b.disabled=true;$('#cm').textContent='Checking…';
  var cs=$('#code').value.split(/[\s,;]+/).filter(Boolean),ok=0;for(var ci=0;ci<cs.length;ci++){if(await tryCode(cs[ci]))ok++}
  if(ok){closeM();view='home';render();toTop()}else{$('#cm').textContent='Invalid code for this device. Check it and try again.';b.disabled=false}}
 else if(a==='rzp'){var ls=selIx();if(!ls.length)return;var em=($('#em')||{}).value||'';em=em.trim();var cm=$('#cm');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){cm.textContent='Please enter your email so we can send your code and restore link.';return}S.email=em;save();t.disabled=true;cm.textContent='Opening secure payment…';
  try{var od=await api('/order',{book:CFG.bookId,ix:ls,dev:S.dev,email:em});await rzpLoad();
   var rp=new Razorpay({key:od.key,order_id:od.order_id,amount:od.amount,currency:'INR',name:CFG.brand||CFG.title,description:CFG.title,prefill:{email:em},theme:{color:CFG.accent||'#2f5bea'},
    handler:async function(resp){cm.textContent='Payment received – unlocking…';try{var n=await claim(resp.razorpay_order_id,resp.razorpay_payment_id,true);if(n){closeM();view='home';render();toTop()}else cm.textContent='Paid, but the unlock failed. Tap “Already paid but not unlocked?”.'}catch(e){cm.textContent='Payment received. Unlock is delayed ('+e.message+'). It retries automatically when you reopen this page.'}},
    modal:{ondismiss:function(){t.disabled=false;cm.textContent=''}}});
   rp.on('payment.failed',function(r){cm.textContent='Payment failed: '+((r.error&&r.error.description)||'please try again');t.disabled=false});rp.open()}
  catch(e){cm.textContent=e.message;t.disabled=false}}
 else if(a==='rzpid'){e.preventDefault();var pid=prompt('Enter your Razorpay payment ID (starts with pay_). You can find it in the payment receipt.',S.pend?S.pend.p:'');if(!pid)return;var oid=S.pend&&S.pend.p===pid.trim()?S.pend.o:prompt('Enter the order ID (starts with order_) from the receipt:');if(!oid)return;
  $('#cm').textContent='Checking payment…';try{var n2=await claim(oid.trim(),pid.trim());if(n2){closeM();view='home';render();toTop()}else $('#cm').textContent='Code did not match this device.'}catch(x){$('#cm').textContent=x.message}}
 else if(a==='tab'){tab=v;render();toTop()}
 else if(a==='fsec'){fSec=v;render()}else if(a==='ffo'){fFo=v;fSec='All';render()}else if(a==='fstat'){fStat=v;render()}
 else if(a==='open')openTest(v);
 else if(a==='begin'){var p=v.split('|');begin(p[0],p.slice(1).join('|'))}
 else if(a==='saved'){var its=items(Object.keys(S.bm));if(its.length)startSession({id:'__saved',title:'Saved questions',mode:'practice',its:its,pos:1,neg:0,time:0,rec:false})}
 else if(a==='retryw'){var its2=[];Object.keys(S.wrong).forEach(function(tid){its2=its2.concat(items(S.wrong[tid].map(function(i){return tid+'#'+i})))});if(its2.length)startSession({id:'__wrong',title:'Retry wrong answers',mode:'practice',its:its2,pos:1,neg:0,time:0,rec:false})}
 else if(a==='home'){view='home';render();toTop()}
 else if(a==='quit'){if(!sess.done&&Object.keys(sess.ans).length&&!confirm('Exit? Your answers will be lost.'))return;clearInterval(tick);view='home';render();toTop()}
 else if(a==='pick'){if(sess.mode==='practice'&&sess.ans[sess.i]!==undefined)return;sess.ans[sess.i]=+v;render()}
 else if(a==='nx'){lap();sess.i++;render();toTop()}else if(a==='prev'){lap();sess.i--;render();toTop()}else if(a==='go'){lap();sess.i=+v;render();toTop()}
 else if(a==='note'){sess.nopen=!sess.nopen;render();var nt=$('textarea.nt');if(nt)nt.focus()}
 else if(a==='star'){if(S.bm[v])delete S.bm[v];else S.bm[v]=1;save();var y=window.scrollY;render();window.scrollTo(0,y)}
 else if(a==='submit'){var left=sess.its.length-Object.keys(sess.ans).length;if(!confirm(left?left+' question(s) unanswered. Submit anyway?':'Submit your answers?'))return;finish()}
 else if(a==='rf'){sess.rf=v;render();var rv=$('#rvh');if(rv)rv.scrollIntoView()}
 else if(a==='share')share()
 else if(a==='jump'){var el=document.getElementById('rv-'+v);if(sess.rf!=='all'){sess.rf='all';render();el=document.getElementById('rv-'+v)}if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
 else if(a==='resetp'){if(confirm('Clear scores, history and wrong-answer list? Saved questions and notes stay.')){S.hist={};S.log=[];S.wrong={};save();render()}}});
document.addEventListener('change',function(e){var t=e.target;if(t.name==='pp'||t.name==='cc'){if(t.name==='pp')document.querySelectorAll('input[name=cc]').forEach(function(x){x.checked=false});else document.querySelectorAll('input[name=pp]').forEach(function(x){x.checked=false});document.querySelectorAll('.rad').forEach(function(r){r.classList.toggle('on',r.querySelector('input').checked)});payBox(selIx())}});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='fq'){fq=t.value;var l=$('#tl');if(l)l.innerHTML=listHTML()}
 else if(t.dataset.nk){var v=t.value;if(v.trim())S.notes[t.dataset.nk]=v;else delete S.notes[t.dataset.nk];save()}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='code'){var b=document.querySelector('[data-a=doUnlock]');b&&b.click()}});
boot();
</script></body></html>
